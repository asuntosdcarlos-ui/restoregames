<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RestoreGames</title>
  <meta name="description" content="Wiki comunitaria de restauración de videojuegos, mods y preservación digital.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/"><span class="logo-mark">▶</span><span id="site-name">RestoreGames</span></a>
    <form id="search-form" class="search" role="search">
      <input name="q" type="search" placeholder="Buscar juego, mod, herramienta…" aria-label="Buscar">
    </form>
    <div id="user-area" class="user-area"></div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <p>Contenido creado por la comunidad · Archivos alojados en Google Drive de cada colaborador</p>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
